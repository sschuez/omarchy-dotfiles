# Herdr config, owned by omarchy-dotfiles (Herdr can't include other files).
# Started from Omarchy's copy; my changes are marked "mine". Omarchy's update
# migrations skip a symlinked config, so check its release notes for Herdr changes.
# Validate after editing: herdr config check    Apply: prefix q

onboarding = false
# Mirrors the Omarchy tmux config in config/tmux/tmux.conf
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

[theme]
# tmux ran on the terminal's own palette (bg=default, fg=default, ANSI blue accents)
name = "terminal"

[theme.custom]
# The tab bar sits on the terminal's own background, like tmux's bg=default, so
# it turns see-through with the rest of the terminal under Glassy windows. With
# no panel_bg the active tab's text falls back to surface_dim, so that is black
# for dark text on the accent - same colors as status-left's "#[fg=black,bg=blue]"
panel_bg = "reset"
surface_dim = "black"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
# mine: stacked split on prefix - (prefix h moves focus instead)
split_horizontal = ["prefix+minus", "alt+enter"]
# mine: side-by-side split also on prefix |
split_vertical = ["prefix+v", "prefix+|", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

# mine: vim keys, without prefix (ctrl+alt+h/j/k/l) and with prefix (h/j/k/l)
focus_pane_left = ["ctrl+alt+left", "ctrl+alt+h", "prefix+h"]
focus_pane_down = ["ctrl+alt+down", "ctrl+alt+j", "prefix+j"]
focus_pane_up = ["ctrl+alt+up", "ctrl+alt+k", "prefix+k"]
focus_pane_right = ["ctrl+alt+right", "ctrl+alt+l", "prefix+l"]

resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# Like resize-pane on C-M-S-arrows
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
# mine: close tab on prefix X (prefix k moves focus up)
close_tab = "prefix+shift+x"
switch_tab = ["prefix+1..9", "alt+1..9"]
# mine: alt+shift+h/l for tabs, like tmux windows
previous_tab = ["prefix+p", "alt+left", "alt+shift+h"]
next_tab = ["prefix+n", "alt+right", "alt+shift+l"]

# Like swap-window -t -1/+1 on M-S-Left/Right
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

# mine: Ctrl+h/j/k/l across panes and Neovim splits, like vim-tmux-navigator
# in tmux. The navigate plugin (navigate-plugin/, next to this file) hands the
# key on to Neovim when it's in the focused pane, and focuses the next pane
# otherwise. Shells lose Ctrl+h/j/k/l, as in tmux. To remove: delete these
# four blocks and run: herdr plugin unlink stephen.navigate
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "stephen.navigate.left"
description = "focus left pane or Neovim split"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "stephen.navigate.down"
description = "focus lower pane or Neovim split"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "stephen.navigate.up"
description = "focus upper pane or Neovim split"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "stephen.navigate.right"
description = "focus right pane or Neovim split"

[ui]
accent = "blue"

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# status-right had the zoom flag followed by #h
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"
