# Ctrl+h/j/k/l across Herdr panes and Neovim splits, like vim-tmux-navigator.
# A plugin rather than a plain [[keys.command]] only for speed: Herdr runs
# plugin actions directly, while custom commands go through a login shell
# (sh -lc), which took ~12 of ~19 ms a key press.
# Linked with: herdr plugin link ~/.config/herdr/navigate-plugin
id = "stephen.navigate"
name = "Navigate"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Ctrl+h/j/k/l across panes and Neovim splits"
platforms = ["linux", "macos"]

[[actions]]
id = "left"
title = "Focus left pane or Neovim split"
command = ["./navigate", "left"]

[[actions]]
id = "down"
title = "Focus lower pane or Neovim split"
command = ["./navigate", "down"]

[[actions]]
id = "up"
title = "Focus upper pane or Neovim split"
command = ["./navigate", "up"]

[[actions]]
id = "right"
title = "Focus right pane or Neovim split"
command = ["./navigate", "right"]
