# My tmux overrides, loaded at the end of ~/.config/tmux/tmux.conf
# so everything here wins over Omarchy's defaults.
# Apply after editing: prefix q (reloads tmux.conf, which loads this file)
# See all bindings:    prefix ?

# Ctrl + h/j/k/l: move between panes. Inside Neovim (or fzf) the keys go to
# that program instead, and Neovim's vim-tmux-navigator plugin hands them back
# to tmux at the edge of its splits, so one set of keys crosses both.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -N "Focus pane left (Neovim-aware)"  -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -N "Focus pane down (Neovim-aware)"  -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -N "Focus pane up (Neovim-aware)"    -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -N "Focus pane right (Neovim-aware)" -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
# Ctrl + l no longer clears the shell, so prefix + Ctrl + l does instead
bind -N "Clear screen" C-l send-keys C-l

# Alt + Shift + H/L: previous / next window
bind -N "Previous window" -n M-H previous-window
bind -N "Next window"     -n M-L next-window
# Alt + [ / ]: the same, as in the browser and Herdr (Hyprland's Alt+[ / Alt+]
# acts only on browsers and passes the keys through)
bind -N "Previous window" -n M-[ previous-window
bind -N "Next window"     -n M-] next-window

# prefix + h/j/k/l: move between panes.
# Replaces Omarchy's h (split, still on prefix - and Alt+Enter),
# k (kill window, moved to X) and tmux's l (last window).
bind -N "Focus pane left"  h select-pane -L
bind -N "Focus pane down"  j select-pane -D
bind -N "Focus pane up"    k select-pane -U
bind -N "Focus pane right" l select-pane -R
bind -N "Kill window"      X kill-window

# prefix + | and -: split side by side / stacked, in the current folder
# (- replaces tmux's built-in delete-buffer, which Omarchy doesn't use)
bind -N "Split pane horizontally" | split-window -h -c "#{pane_current_path}"
bind -N "Split pane vertically"   - split-window -v -c "#{pane_current_path}"
