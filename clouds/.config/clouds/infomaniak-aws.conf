# The aws command's settings under `infomaniak` (its AWS_CONFIG_FILE), for
# the buckets of Infomaniak's Public Cloud. The bucket goes in the path, not
# in the hostname: buckets there are named per project, which a hostname
# can't say. The keys come from 1Password, never from here.
[default]
region = gva2
endpoint_url = https://s3.gva2.infomaniak.cloud
s3 =
  addressing_style = path
